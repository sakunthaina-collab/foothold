<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Safeguard v4.0 — Multi-Case Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans Thai', -apple-system, sans-serif; background: #0f1419; color: #e5e7eb; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { margin-bottom: 32px; }
.header h1 { font-size: 24px; font-weight: 600; color: #f3f4f6; margin-bottom: 8px; }
.header p { font-size: 13px; color: #9ca3af; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat-card { background: #1f2937; border: 0.5px solid #374151; border-radius: 8px; padding: 16px; }
.stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 600; color: #fcd34d; }
.stat-badge { display: inline-block; font-size: 10px; background: #374151; color: #d1d5db; padding: 4px 8px; border-radius: 4px; margin-top: 8px; }
.section-title { font-size: 14px; font-weight: 600; color: #f3f4f6; margin: 28px 0 16px; text-transform: uppercase; letter-spacing: 0.5px; }
.case-row { background: #1f2937; border: 0.5px solid #374151; border-radius: 6px; padding: 16px; display: grid; grid-template-columns: 120px 1fr 80px 100px 80px; gap: 12px; align-items: center; margin-bottom: 8px; }
.case-row:hover { background: #2d3748; border-color: #4b5563; }
.case-id { font-size: 12px; font-weight: 600; color: #fcd34d; font-family: 'IBM Plex Mono', monospace; }
.case-name { font-size: 12px; color: #d1d5db; }
.type-badge { font-size: 10px; font-weight: 500; padding: 4px 8px; border-radius: 4px; background: #374151; color: #d1d5db; text-align: center; }
.status-badge { font-size: 11px; font-weight: 500; padding: 6px 10px; border-radius: 4px; text-align: center; }
.status-urgent { background: #7f1d1d; color: #fecaca; }
.status-at-risk { background: #78350f; color: #fde047; }
.status-on-track { background: #14532d; color: #86efac; }
.deadline { font-size: 11px; color: #9ca3af; }
.progress-bar { width: 100%; height: 4px; background: #374151; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; background: #fcd34d; border-radius: 2px; }
.controls { display: flex; gap: 12px; margin-top: 28px; }
.btn { padding: 10px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
.btn-primary { background: #fcd34d; color: #0f1419; }
.btn-primary:hover { background: #fde047; }
.btn-secondary { background: #374151; color: #d1d5db; }
.btn-secondary:hover { background: #4b5563; }
.back-btn { font-size: 12px; color: #fcd34d; text-decoration: none; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 768px) {
  .case-row { grid-template-columns: 1fr 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">&larr; กลับไปเครื่องมือตัวเดียว</a>
  <div class="header">
    <h1>📋 Legal Safeguard v4.0 — Multi-Case Dashboard</h1>
    <p>Manage multiple AMLO/Prasan/EDD cases from a single view</p>
  </div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Active Cases</div>
      <div class="stat-value" id="totalCases">7</div>
      <span class="stat-badge">ปปง./Prasan/EDD</span>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔴 Urgent</div>
      <div class="stat-value" style="color: #fecaca;" id="urgentCount">2</div>
      <span class="stat-badge">&le; 7 days</span>
    </div>
    <div class="stat-card">
      <div class="stat-label">🟡 At Risk</div>
      <div class="stat-value" style="color: #fde047;" id="atRiskCount">3</div>
      <span class="stat-badge">&le; 15 days</span>
    </div>
    <div class="stat-card">
      <div class="stat-label">✓ On Track</div>
      <div class="stat-value" style="color: #86efac;" id="onTrackCount">2</div>
      <span class="stat-badge">&gt; 15 days</span>
    </div>
  </div>
  <div class="section-title">📁 Case Queue</div>
  <div id="caseList"></div>
  <div class="section-title">📌 Next Actions (This Week)</div>
  <div id="actionList"></div>
  <div class="controls">
    <button class="btn btn-primary" onclick="addCase()">+ New Case</button>
    <button class="btn btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
    <button class="btn btn-secondary" onclick="resetDemo()">🔄 Reset Demo</button>
  </div>
</div>
<script>
const DEMO_CASES = [
  { id: "ปปง. 1-00847-2569", name: "M.P. Account Freeze", type: "AMLO", deadline: "2026-08-05", evidencePercent: 85, petitionPercent: 67, priority: "high", nextAction: "Submit FRO1 by Aug 5" },
  { id: "ปปง. 1-00923-2569", name: "Khlong Toei Co., Ltd", type: "Prasan", deadline: "2026-08-08", evidencePercent: 72, petitionPercent: 50, priority: "high", nextAction: "Deliver CFR to Prasan" },
  { id: "ปปง. 1-00756-2569", name: "P.K. Sole Proprietor", type: "EDD", deadline: "2026-08-15", evidencePercent: 58, petitionPercent: 40, priority: "medium", nextAction: "Confirm EDD status via 1441" },
  { id: "ปปง. 1-00615-2569", name: "A.S. Joint Liability", type: "AMLO", deadline: "2026-08-19", evidencePercent: 45, petitionPercent: 25, priority: "medium", nextAction: "Collect 3 supporting docs" },
  { id: "ปปง. 1-00521-2569", name: "S.N. Unauthorized Use", type: "Prasan", deadline: "2026-08-23", evidencePercent: 62, petitionPercent: 25, priority: "medium", nextAction: "Await legal review" },
  { id: "ปปง. 1-00489-2569", name: "B.K. Dormant Account", type: "EDD", deadline: "2026-08-30", evidencePercent: 30, petitionPercent: 15, priority: "low", nextAction: "Start initial draft" },
  { id: "ปปง. 1-00421-2569", name: "T.M. Clearance", type: "AMLO", deadline: "2026-08-08", evidencePercent: 100, petitionPercent: 100, priority: "low", nextAction: "Closed - Account unfrozen" }
];

function initDashboard() {
  if (!localStorage.getItem('cases')) {
    localStorage.setItem('cases', JSON.stringify(DEMO_CASES));
  }
  renderDashboard();
}

function getStatus(deadline) {
  const days = Math.ceil((new Date(deadline) - new Date()) / 86400000);
  if (days <= 7) return { status: 'urgent', badge: '🔴 URGENT', class: 'status-urgent' };
  if (days <= 15) return { status: 'at_risk', badge: '🟡 AT RISK', class: 'status-at-risk' };
  return { status: 'on_track', badge: '✓ ON TRACK', class: 'status-on-track' };
}

function renderDashboard() {
  const cases = JSON.parse(localStorage.getItem('cases') || '[]');
  const sorted = cases.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  const urgent = sorted.filter(c => getStatus(c.deadline).status === 'urgent').length;
  const atRisk = sorted.filter(c => getStatus(c.deadline).status === 'at_risk').length;
  const onTrack = sorted.filter(c => getStatus(c.deadline).status === 'on_track').length;
  
  document.getElementById('totalCases').textContent = sorted.length;
  document.getElementById('urgentCount').textContent = urgent;
  document.getElementById('atRiskCount').textContent = atRisk;
  document.getElementById('onTrackCount').textContent = onTrack;
  
  let html = '';
  sorted.forEach(c => {
    const status = getStatus(c.deadline);
    html += `<div class="case-row">
      <div><div class="case-id">${c.id}</div><div class="case-name">${c.name}</div></div>
      <div><span class="type-badge">${c.type}</span></div>
      <span class="deadline">${new Date(c.deadline).toLocaleDateString('th-TH')}</span>
      <span class="status-badge ${status.class}">${status.badge}</span>
      <div><div class="progress-bar"><div class="progress-fill" style="width: ${c.evidencePercent}%"></div></div><small style="color: #9ca3af; font-size: 10px;">${c.evidencePercent}% evidence</small></div>
    </div>`;
  });
  document.getElementById('caseList').innerHTML = html;
  
  let actions = '';
  sorted.slice(0, 4).forEach(c => {
    if (c.nextAction && c.nextAction !== 'Closed - Account unfrozen') {
      actions += `<div style="background: #1f2937; border: 0.5px solid #374151; border-radius: 6px; padding: 12px; margin-bottom: 8px; font-size: 12px;"><strong>${c.id}:</strong> ${c.nextAction}</div>`;
    }
  });
  document.getElementById('actionList').innerHTML = actions;
}

function addCase() { alert('Feature coming in v4.1'); }
function exportCSV() { alert('Feature coming in v4.1'); }
function resetDemo() { localStorage.setItem('cases', JSON.stringify(DEMO_CASES)); renderDashboard(); }

document.addEventListener('DOMContentLoaded', initDashboard);
</script>
</body>
</html>
