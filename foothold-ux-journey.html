<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งหลัก (Foothold) — UX Journey Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0B1B2B;
    --ink-800:#122336;
    --ink-700:#16283B;
    --ink-600:#223851;
    --paper:#EEF1EE;
    --paper-line:#D8DFDA;
    --gold-500:#B8935A;
    --gold-300:#D8BD8E;
    --risk-red:#A23B33;
    --risk-red-bg:#F3E3E1;
    --risk-amber:#9C7328;
    --risk-amber-bg:#F1E8D3;
    --risk-green:#3E6B54;
    --risk-green-bg:#DEE9E2;
    --text-inverse:#EEF1EE;
    --text-muted-inverse:#9FB0C2;
    --text-primary:#16283B;
    --text-muted:#5C6C7A;
    --radius:3px;
    --serif:'Noto Serif Thai', serif;
    --sans:'IBM Plex Sans Thai', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink-900);}
  body{
    font-family:var(--sans);
    color:var(--text-primary);
    min-height:100vh;
  }
  ::selection{background:var(--gold-300);color:var(--ink-900);}
  :focus-visible{outline:2px solid var(--gold-500);outline-offset:2px;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink-900);
    color:var(--text-inverse);
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--ink-600);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:32px;height:32px;border:1.5px solid var(--gold-500);
    border-radius:2px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--gold-300);flex-shrink:0;
  }
  .brand-text h1{
    font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.2px;
  }
  .brand-text p{margin:0;font-size:11px;color:var(--text-muted-inverse);font-family:var(--mono);letter-spacing:.5px;}
  .top-right{display:flex;align-items:center;gap:18px;}
  .pdpa-badge{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--ink-600);background:var(--ink-800);
    padding:6px 12px;border-radius:20px;font-size:12px;color:var(--text-muted-inverse);
  }
  .pdpa-dot{width:6px;height:6px;border-radius:50%;background:var(--risk-green);flex-shrink:0;}
  .case-ref{font-family:var(--mono);font-size:12px;color:var(--gold-300);letter-spacing:.5px;}

  /* ---------- Progress strip ---------- */
  .progress-strip{display:flex;gap:2px;padding:0 28px;background:var(--ink-900);}
  .progress-seg{height:3px;flex:1;background:var(--ink-600);}
  .progress-seg.done{background:var(--gold-500);}

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:262px 1fr;
    min-height:calc(100vh - 76px);
    background:var(--ink-900);
  }

  /* ---------- Dossier rail ---------- */
  .rail{
    background:var(--ink-900);
    padding:22px 0 22px 0;
    border-right:1px solid var(--ink-600);
  }
  .rail-heading{
    font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;
    color:var(--text-muted-inverse);padding:0 22px 14px;text-transform:uppercase;
  }
  .tab{
    display:flex;align-items:center;gap:11px;
    padding:10px 16px 10px 22px;
    margin-right:14px;
    cursor:pointer;
    border-left:2px solid transparent;
    color:var(--text-muted-inverse);
    transition:background .15s ease, border-color .15s ease, margin-right .15s ease, color .15s ease;
    position:relative;
  }
  .tab:hover{background:var(--ink-800);color:var(--text-inverse);}
  .tab-no{
    font-family:var(--mono);font-size:11px;color:inherit;
    width:20px;flex-shrink:0;
  }
  .tab-label{font-size:13px;line-height:1.35;}
  .tab.active{
    background:var(--paper);
    color:var(--ink-900);
    border-left:2px solid var(--gold-500);
    margin-right:0;
    border-top-left-radius:2px;border-bottom-left-radius:2px;
  }
  .tab.active .tab-no{color:var(--gold-500);font-weight:600;}
  .tab.active::after{
    content:"";position:absolute;right:-1px;top:0;bottom:0;width:14px;background:var(--paper);
  }

  /* ---------- Canvas ---------- */
  .canvas-wrap{
    background:var(--paper);
    padding:34px 42px 30px;
    display:flex;flex-direction:column;
  }
  .step-kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--gold-500);
    text-transform:uppercase;margin-bottom:6px;
  }
  .step-title{
    font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink-900);
    margin:0 0 20px;letter-spacing:.2px;
  }

  /* browser frame mock */
  .browser-frame{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:6px;
    box-shadow:0 1px 2px rgba(11,27,43,0.06), 0 8px 24px rgba(11,27,43,0.07);
    overflow:hidden;
  }
  .browser-chrome{
    background:#E4E8E4;
    padding:9px 12px;
    display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--paper-line);
  }
  .chrome-dot{width:8px;height:8px;border-radius:50%;background:#C7CFC9;}
  .chrome-url{
    flex:1;background:#fff;border-radius:4px;padding:4px 10px;
    font-family:var(--mono);font-size:10.5px;color:var(--text-muted);
    border:1px solid var(--paper-line);
  }
  .screen{padding:34px 40px;min-height:340px;}

  /* ---------- Notes ---------- */
  .design-note{
    margin-top:18px;
    display:flex;gap:10px;
    background:var(--ink-800);
    border-left:2px solid var(--gold-500);
    padding:13px 16px;
    border-radius:2px;
  }
  .design-note .label{
    font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--gold-300);
    text-transform:uppercase;flex-shrink:0;padding-top:1px;
  }
  .design-note p{margin:0;color:var(--text-muted-inverse);font-size:12.5px;line-height:1.6;}

  /* ---------- Nav controls ---------- */
  .step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .nav-btn{
    font-family:var(--sans);font-size:13px;font-weight:500;
    background:none;border:1px solid var(--ink-600);color:var(--text-inverse);
    padding:9px 18px;border-radius:2px;cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .nav-btn:hover{background:var(--ink-800);}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn.primary{background:var(--gold-500);border-color:var(--gold-500);color:var(--ink-900);font-weight:600;}
  .nav-btn.primary:hover{background:var(--gold-300);}
  .step-count{font-family:var(--mono);font-size:12px;color:var(--text-muted-inverse);}

  /* ---------- Reusable content pieces ---------- */
  .lede{color:var(--text-muted);font-size:14px;line-height:1.7;margin:0 0 22px;max-width:520px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink-900);color:#fff;border:none;
    padding:11px 22px;border-radius:3px;font-size:14px;font-weight:500;cursor:pointer;
  }
  .btn.ghost{background:none;border:1px solid var(--paper-line);color:var(--ink-900);}
  .trust-row{display:flex;gap:10px;margin:18px 0 26px;flex-wrap:wrap;}
  .trust-pill{
    font-size:11.5px;color:var(--text-muted);border:1px solid var(--paper-line);
    padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;
  }
  .trust-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--risk-green);}

  .consent-box{border:1px solid var(--paper-line);border-radius:4px;padding:20px;max-width:560px;background:#FAFBF9;}
  .consent-box h3{margin:0 0 10px;font-size:14px;font-family:var(--serif);}
  .consent-box p{margin:0 0 8px;font-size:13px;color:var(--text-muted);line-height:1.65;}
  .consent-check{display:flex;align-items:flex-start;gap:9px;margin-top:14px;font-size:12.5px;color:var(--text-primary);}

  .progress-line{display:flex;align-items:center;gap:8px;margin-bottom:24px;max-width:420px;}
  .progress-line .bar{flex:1;height:5px;background:var(--paper-line);border-radius:3px;overflow:hidden;}
  .progress-line .bar span{display:block;height:100%;background:var(--gold-500);}
  .progress-line small{font-family:var(--mono);font-size:11px;color:var(--text-muted);}

  .quiz-card{border:1px solid var(--paper-line);border-radius:4px;padding:22px;max-width:520px;}
  .quiz-card .q{font-size:15px;font-weight:500;margin:0 0 16px;}
  .opt{
    display:flex;align-items:center;gap:11px;
    border:1px solid var(--paper-line);border-radius:3px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;
  }
  .opt .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--text-muted);flex-shrink:0;}
  .opt.selected{border-color:var(--ink-900);background:#F5F6F4;}
  .opt.selected .radio{border-color:var(--ink-900);background:radial-gradient(circle,var(--ink-900) 0 40%, transparent 44%);}

  .yesno-row{display:flex;gap:14px;max-width:520px;}
  .yesno-btn{
    flex:1;padding:26px 14px;text-align:center;border:1px solid var(--paper-line);border-radius:4px;
    font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text-primary);
  }
  .yesno-btn.yes{border-color:var(--risk-green);color:var(--risk-green);}
  .yesno-btn.no{border-color:var(--risk-red);color:var(--risk-red);}

  .field-block{max-width:480px;margin-bottom:16px;}
  .field-block label{display:block;font-size:12.5px;font-weight:500;margin-bottom:7px;color:var(--text-primary);}
  .field-block .input{border:1px solid var(--paper-line);border-radius:3px;padding:11px 13px;font-family:var(--mono);font-size:13px;color:var(--text-muted);background:#fff;}
  .field-hint{font-size:11.5px;color:var(--text-muted);margin-top:6px;}
  .toggle-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-muted);margin-top:14px;}

  .result-grid{display:flex;gap:14px;max-width:640px;}
  .result-card{flex:1;border-radius:4px;padding:18px;border:1.5px solid transparent;opacity:.45;}
  .result-card.active{opacity:1;box-shadow:0 4px 14px rgba(11,27,43,0.08);}
  .result-card .swatch{width:26px;height:26px;border-radius:50%;margin-bottom:12px;}
  .result-card h4{margin:0 0 6px;font-family:var(--serif);font-size:15px;}
  .result-card p{margin:0;font-size:12px;line-height:1.6;color:var(--text-muted);}
  .rc-red{background:var(--risk-red-bg);}
  .rc-red .swatch{background:var(--risk-red);}
  .rc-red.active{border-color:var(--risk-red);}
  .rc-amber{background:var(--risk-amber-bg);}
  .rc-amber .swatch{background:var(--risk-amber);}
  .rc-amber.active{border-color:var(--risk-amber);}
  .rc-green{background:var(--risk-green-bg);}
  .rc-green .swatch{background:var(--risk-green);}
  .rc-green.active{border-color:var(--risk-green);}

  .timeline{display:flex;max-width:600px;margin-top:6px;}
  .tl-step{flex:1;position:relative;padding-top:20px;}
  .tl-step::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--paper-line);}
  .tl-step.filled::before{background:var(--gold-500);}
  .tl-step .dot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--gold-500);transform:translateX(-50%);}
  .tl-step:first-child .dot{left:0;transform:none;}
  .tl-step .tl-day{font-family:var(--mono);font-size:11px;color:var(--gold-500);font-weight:600;}
  .tl-step .tl-label{font-size:11.5px;color:var(--text-muted);margin-top:3px;}

  .doc-grid{display:flex;gap:14px;max-width:640px;}
  .doc-card{flex:1;border:1px solid var(--paper-line);border-radius:4px;padding:18px;}
  .doc-card.recommended{border:1.5px solid var(--ink-900);}
  .doc-code{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink-900);}
  .doc-card p{font-size:12px;color:var(--text-muted);line-height:1.6;margin:8px 0 12px;}
  .doc-badge{font-size:10.5px;font-family:var(--mono);background:var(--ink-900);color:#fff;padding:3px 8px;border-radius:10px;}

  .textarea-mock{
    border:1px solid var(--paper-line);border-radius:4px;max-width:560px;min-height:110px;
    padding:14px;font-size:13px;color:var(--text-muted);line-height:1.7;background:#fff;
  }
  .hint-chip{display:inline-block;font-size:11px;color:var(--text-muted);border:1px dashed var(--paper-line);padding:4px 9px;border-radius:12px;margin:10px 6px 0 0;}

  .tone-row{display:flex;gap:10px;max-width:560px;margin-bottom:18px;}
  .tone-pill{flex:1;text-align:center;border:1px solid var(--paper-line);border-radius:3px;padding:10px;font-size:12.5px;color:var(--text-muted);}
  .tone-pill.active{border-color:var(--ink-900);color:var(--ink-900);font-weight:600;background:#F5F6F4;}
  .tone-preview{border:1px solid var(--paper-line);border-radius:4px;padding:18px;max-width:560px;font-size:13px;line-height:1.85;color:var(--text-primary);background:#fff;font-family:var(--serif);}

  .review-doc{
    border:1px solid var(--paper-line);max-width:520px;padding:26px 28px;background:#fff;
    font-family:var(--serif);position:relative;
  }
  .review-doc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold-500);}
  .review-doc .doc-h{font-size:13px;color:var(--text-muted);font-family:var(--mono);margin-bottom:14px;}
  .review-doc .doc-title{font-size:16px;font-weight:600;margin:0 0 14px;}
  .review-doc .doc-line{height:8px;background:var(--paper-line);border-radius:2px;margin-bottom:9px;}
  .review-actions{display:flex;gap:10px;margin-top:18px;}

  .checklist{max-width:520px;}
  .cl-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--paper-line);align-items:flex-start;}
  .cl-check{width:18px;height:18px;border-radius:50%;background:var(--risk-green);flex-shrink:0;margin-top:1px;}
  .cl-item h5{margin:0 0 3px;font-size:13.5px;}
  .cl-item p{margin:0;font-size:12px;color:var(--text-muted);}

  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
    .rail{display:flex;overflow-x:auto;padding:14px 0;border-right:none;border-bottom:1px solid var(--ink-600);}
    .rail-heading{display:none;}
    .tab{flex-direction:column;gap:4px;padding:8px 12px;margin-right:4px;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;}
    .tab.active{border-left:none;border-bottom:2px solid var(--gold-500);margin-right:4px;}
    .tab.active::after{display:none;}
    .canvas-wrap{padding:22px 18px;}
    .result-grid,.doc-grid,.yesno-row{flex-direction:column;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">FH</div>
    <div class="brand-text">
      <h1>ตั้งหลัก · Foothold</h1>
      <p>UX JOURNEY BLUEPRINT — v3.2</p>
    </div>
  </div>
  <div class="top-right">
    <div class="pdpa-badge"><span class="pdpa-dot"></span>ไม่จัดเก็บข้อมูลส่วนบุคคล · PDPA</div>
    <div class="case-ref">CASE-2569-00142</div>
  </div>
</div>
<div class="progress-strip" id="progressStrip"></div>

<div class="layout">
  <div class="rail">
    <div class="rail-heading">สารบัญคดี · 12 ขั้นตอน</div>
    <div id="railTabs"></div>
  </div>

  <div class="canvas-wrap">
    <div class="step-kicker" id="stepKicker"></div>
    <h2 class="step-title" id="stepTitle"></h2>

    <div class="browser-frame">
      <div class="browser-chrome">
        <div class="chrome-dot"></div><div class="chrome-dot"></div><div class="chrome-dot"></div>
        <div class="chrome-url" id="chromeUrl"></div>
      </div>
      <div class="screen" id="screen"></div>
    </div>

    <div class="design-note">
      <div class="label">เหตุผลเชิงออกแบบ</div>
      <p id="designNote"></p>
    </div>

    <div class="step-nav">
      <button class="nav-btn" id="prevBtn">← ขั้นตอนก่อนหน้า</button>
      <span class="step-count" id="stepCount"></span>
      <button class="nav-btn primary" id="nextBtn">ขั้นตอนถัดไป →</button>
    </div>
  </div>
</div>

<script>
const STEPS = [
{
  tab:"หน้าแรก", kicker:"ENTRY POINT", title:"หน้าแรก — เริ่มต้นตรวจสอบสิทธิ์", route:"/",
  note:"เปิดด้วยคำถามเดียวที่ผู้ใช้อยากรู้ที่สุด — ต้องทำอย่างไรต่อ — ไม่ใช่การอธิบายระบบ ป้ายความน่าเชื่อถือ (ฟรี / ไม่เก็บข้อมูล / ใช้เวลาเท่าไร) วางไว้เหนือ fold เพื่อลดความลังเลของผู้ใช้ที่กำลังเครียดเรื่องการเงิน",
  body:`
    <p class="lede">หากบัญชีของท่านถูกอายัดโดยมาตรการป้องกันและปราบปรามการฟอกเงิน ระบบนี้จะช่วยประเมินสิทธิ์และจัดทำคำร้องเบื้องต้นให้ท่านภายในไม่กี่ขั้นตอน</p>
    <div class="trust-row">
      <div class="trust-pill"><span class="dot"></span>ไม่มีค่าใช้จ่าย</div>
      <div class="trust-pill"><span class="dot"></span>ไม่เก็บข้อมูลบนเซิร์ฟเวอร์</div>
      <div class="trust-pill"><span class="dot"></span>ใช้เวลาประมาณ 8–10 นาที</div>
    </div>
    <button class="btn">เริ่มตรวจสอบสิทธิ์ของท่าน</button>
  `
},
{
  tab:"ความยินยอม", kicker:"CONSENT · PDPA", title:"คำชี้แจงการประมวลผลข้อมูล", route:"/consent",
  note:"เพราะ state machine ทำงานฝั่ง client ทั้งหมด จึงสื่อสารเรื่องนี้เป็นจุดขายด้านความไว้วางใจ ไม่ใช่ข้อความกฎหมายเล็ก ๆ ที่ถูกมองข้าม",
  body:`
    <div class="consent-box">
      <h3>ข้อมูลของท่านจะไม่ถูกส่งออกจากเครื่อง</h3>
      <p>คำตอบทั้งหมดถูกประมวลผลและจัดเก็บชั่วคราวในเบราว์เซอร์ของท่านเท่านั้น (Local State Machine) ระบบจะไม่บันทึกหรือส่งข้อมูลส่วนบุคคลไปยังเซิร์ฟเวอร์ใด ๆ จนกว่าท่านจะเลือกดาวน์โหลดเอกสาร</p>
      <p>เอกสารกฎหมายและเกณฑ์การประเมินอ้างอิงจากฐานข้อมูล AMLO Regulatory Compliance Engine ที่อัปเดตล่าสุด</p>
      <div class="consent-check"><div class="radio" style="width:15px;height:15px;border:1.5px solid #16283B;border-radius:3px;"></div>ข้าพเจ้ารับทราบและยินยอมให้ประมวลผลข้อมูลตามที่ระบุ</div>
    </div>
    <div style="margin-top:18px;"><button class="btn">รับทราบและดำเนินการต่อ</button></div>
  `
},

const railTabs = document.getElementById('railTabs');
const progressStrip = document.getElementById('progressStrip');
STEPS.forEach((s,i)=>{
  const seg = document.createElement('div');
  seg.className='progress-seg';
  progressStrip.appendChild(seg);
});

let current = 0;

function renderRail(){
  railTabs.innerHTML = '';
  STEPS.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'tab' + (i===current ? ' active':'');
    el.innerHTML = `<span class="tab-no">${String(i+1).padStart(2,'0')}</span><span class="tab-label">${s.tab}</span>`;
    el.addEventListener('click', ()=>goTo(i));
    railTabs.appendChild(el);
  });
}

function renderProgress(){
  [...progressStrip.children].forEach((seg,i)=>{
    seg.classList.toggle('done', i<=current);
  });
}

function render(){
  const s = STEPS[current];
  document.getElementById('stepKicker').textContent = s.kicker;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('chromeUrl').textContent = 'foodhole.netlify.app' + s.route;
  document.getElementById('screen').innerHTML = s.body;
  document.getElementById('designNote').textContent = s.note;
  document.getElementById('stepCount').textContent = `ขั้นตอน ${current+1} / ${STEPS.length}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===STEPS.length-1;
  document.getElementById('nextBtn').textContent = current===STEPS.length-1 ? 'ขั้นตอนสุดท้าย' : 'ขั้นตอนถัดไป →';
  renderRail();
  renderProgress();
}

function goTo(i){
  current = Math.max(0, Math.min(STEPS.length-1, i));
  render();
  document.querySelector('.canvas-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));

render();
</script>
